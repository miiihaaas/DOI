{% extends "account/_auth_layout.html" %}

{% block title %}Odjava - DOI Portal{% endblock title %}

{% block content %}
      <h1>Odjava</h1>
      <p class="form-intro">Da li ste sigurni da želite da se odjavite?</p>

      <form method="post" action="{% url 'account_logout' %}">
        {% csrf_token %}

        {% if redirect_field_value %}
        <input type="hidden" name="{{ redirect_field_name }}" value="{{ redirect_field_value }}" />
        {% endif %}

        <div class="auth-actions">
          <button type="submit" class="btn btn-primary btn-login w-100">
            <i class="bi bi-box-arrow-right me-1" aria-hidden="true"></i>Odjavi se
          </button>
          <a href="{% url 'dashboard' %}" class="btn btn-auth-secondary w-100">Otkaži</a>
        </div>
      </form>

      <div class="text-center mt-4">
        <a href="{% url 'home' %}" class="back-link">
          <i class="bi bi-arrow-left" aria-hidden="true"></i>
          Nazad na početnu
        </a>
      </div>
{% endblock content %}
