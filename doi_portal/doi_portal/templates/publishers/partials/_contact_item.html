<li class="list-group-item d-flex align-items-start gap-2" id="contact-{{ contact.pk }}">
  <div class="flex-grow-1">
    <span class="fw-semibold">{{ contact.first_name }} {{ contact.last_name }}</span>{% if contact.role %}<span class="text-muted"> · {{ contact.role }}</span>{% endif %}
    {% if contact.email or contact.phone %}
    <div class="small text-muted d-flex flex-wrap column-gap-3">
      {% if contact.email %}<span><i class="bi bi-envelope me-1" aria-hidden="true"></i><a href="mailto:{{ contact.email }}">{{ contact.email }}</a></span>{% endif %}
      {% if contact.phone %}<span><i class="bi bi-telephone me-1" aria-hidden="true"></i>{{ contact.phone }}</span>{% endif %}
    </div>
    {% endif %}
  </div>
  <div class="row-actions">
    <button type="button"
            class="btn-icon"
            title="Izmeni"
            aria-label="Izmeni kontakt {{ contact.first_name }} {{ contact.last_name }}"
            hx-get="{% url 'publishers:contact-edit-form' pk=contact.pk %}"
            hx-target="#contact-form-container"
            hx-swap="innerHTML">
      <i class="bi bi-pencil" aria-hidden="true"></i>
    </button>
    <button type="button"
            class="btn-icon btn-icon--danger"
            title="Obriši"
            aria-label="Obriši kontakt {{ contact.first_name }} {{ contact.last_name }}"
            hx-post="{% url 'publishers:contact-delete' pk=contact.pk %}"
            hx-target="#contacts-section"
            hx-swap="innerHTML"
            hx-confirm="Obrisati kontakt osobu?">
      <i class="bi bi-trash" aria-hidden="true"></i>
    </button>
  </div>
</li>
