<span x-data="{ copied: false, copy() { navigator.clipboard.writeText(this.$refs.value.textContent).then(() => { this.copied = true; setTimeout(() => this.copied = false, 1500) }) } }">
  <code x-ref="value">{{ password }}</code>
  <button type="button"
          class="btn btn-sm btn-outline-secondary ms-2"
          @click="copy()"
          :title="copied ? 'Kopirano!' : 'Kopiraj u clipboard'">
    <i class="bi" :class="copied ? 'bi-check-lg text-success' : 'bi-clipboard'"></i>
  </button>
</span>
<form method="post"
      class="d-inline"
      hx-post="{% url 'publishers:hide-crossref-password' pk=publisher.pk %}"
      hx-target="#crossref-password-cell"
      hx-swap="innerHTML">
  {% csrf_token %}
  <button type="submit" class="btn btn-sm btn-outline-secondary ms-2">
    <i class="bi bi-eye-slash"></i> Sakrij
  </button>
</form>
