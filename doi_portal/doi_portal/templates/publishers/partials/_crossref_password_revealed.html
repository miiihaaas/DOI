<span class="d-inline-flex align-items-center gap-2" x-data="{ copied: false, copy() { navigator.clipboard.writeText(this.$refs.value.textContent).then(() => { this.copied = true; setTimeout(() => this.copied = false, 1500) }) } }">
  <code class="admin-code" x-ref="value">{{ password }}</code>
  <button type="button"
          class="btn-icon"
          @click="copy()"
          title="Kopiraj"
          aria-label="Kopiraj lozinku"
          :title="copied ? 'Kopirano!' : 'Kopiraj'">
    <i class="bi" :class="copied ? 'bi-check-lg' : 'bi-clipboard'" aria-hidden="true"></i>
  </button>
  <span class="visually-hidden" role="status" x-text="copied ? 'Kopirano' : ''"></span>
</span>
<button type="button"
        class="btn btn-sm btn-outline-secondary"
        hx-post="{% url 'publishers:hide-crossref-password' pk=publisher.pk %}"
        hx-target="#crossref-password-cell"
        hx-swap="innerHTML">
  <i class="bi bi-eye-slash me-1" aria-hidden="true"></i>Sakrij
</button>
