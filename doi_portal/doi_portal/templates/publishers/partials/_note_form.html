<li class="list-group-item" id="note-{{ note.pk }}">
  <form method="post"
        hx-post="{% url 'publishers:note-update' pk=note.pk %}"
        hx-target="#notes-section"
        hx-swap="innerHTML">
    {% csrf_token %}
    <label class="d-block mb-2">
      <span class="visually-hidden">Izmeni napomenu</span>
      {{ form.text }}
    </label>
    {% if form.text.errors %}
    <div class="field__error invalid-feedback d-block mb-2">{% for error in form.text.errors %}<div>{{ error }}</div>{% endfor %}</div>
    {% endif %}
    <div class="d-flex justify-content-end gap-2">
      <button type="button"
              class="btn btn-sm btn-outline-secondary"
              hx-get="{% url 'publishers:note-list' publisher_pk=publisher.pk %}"
              hx-target="#notes-section"
              hx-swap="innerHTML">
        Otkaži
      </button>
      <button type="submit" class="btn btn-sm btn-outline-primary">
        <i class="bi bi-check-lg me-1" aria-hidden="true"></i>Sačuvaj napomenu
      </button>
    </div>
  </form>
</li>
