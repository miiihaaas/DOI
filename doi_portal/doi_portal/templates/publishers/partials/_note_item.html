<li class="list-group-item" id="note-{{ note.pk }}">
  <div class="d-flex justify-content-between align-items-start gap-2">
    <div>
      <span class="fw-semibold">{{ note.author.get_full_name|default:note.author.username }}</span>
      <span class="text-muted small ms-1">
        {{ note.created_at|date:"d.m.Y. H:i" }}{% if note.is_edited %} · izmenjeno {{ note.updated_at|date:"d.m.Y. H:i" }}{% endif %}
      </span>
    </div>
    <div class="row-actions">
      <button type="button"
              class="btn-icon"
              title="Izmeni"
              aria-label="Izmeni napomenu"
              hx-get="{% url 'publishers:note-edit-form' pk=note.pk %}"
              hx-target="#note-{{ note.pk }}"
              hx-swap="outerHTML">
        <i class="bi bi-pencil" aria-hidden="true"></i>
      </button>
      <button type="button"
              class="btn-icon btn-icon--danger"
              title="Obriši"
              aria-label="Obriši napomenu"
              hx-post="{% url 'publishers:note-delete' pk=note.pk %}"
              hx-target="#notes-section"
              hx-swap="innerHTML"
              hx-confirm="Obrisati napomenu?">
        <i class="bi bi-trash" aria-hidden="true"></i>
      </button>
    </div>
  </div>
  <p class="mb-0 mt-1">{{ note.text|linebreaksbr }}</p>
</li>
