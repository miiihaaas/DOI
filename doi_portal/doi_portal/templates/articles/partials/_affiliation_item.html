{% load i18n %}
<div class="d-flex align-items-center py-1 ms-4">
    <i class="bi bi-building me-2 text-muted" aria-hidden="true"></i>
    <span class="flex-grow-1">
        {{ affiliation.institution_name }}
        {% if affiliation.department %}<span class="text-muted">, {{ affiliation.department }}</span>{% endif %}
        {% if affiliation.institution_ror_id %}
            <a href="{{ affiliation.institution_ror_id }}" target="_blank" rel="noopener" class="ms-1 text-muted"
               title="ROR zapis (otvara se u novoj kartici)" aria-label="ROR zapis za {{ affiliation.institution_name }} (otvara se u novoj kartici)">
                <i class="bi bi-box-arrow-up-right" aria-hidden="true"></i>
            </a>
        {% endif %}
    </span>
    <button type="button" class="btn btn-sm btn-outline-primary ms-2"
            hx-get="{% url 'articles:affiliation-edit-form' pk=affiliation.pk %}"
            hx-target="#author-form-container"
            hx-swap="innerHTML"
            title="Izmeni afilijaciju" aria-label="Izmeni afilijaciju {{ affiliation.institution_name }}">
        <i class="bi bi-pencil" aria-hidden="true"></i>
    </button>
    <button type="button" class="btn btn-sm btn-outline-danger ms-2"
            hx-post="{% url 'articles:affiliation-delete' pk=affiliation.pk %}"
            hx-target="#authors-section-content"
            hx-swap="innerHTML"
            hx-confirm="Da li ste sigurni da želite ukloniti afilijaciju?"
            title="Ukloni afilijaciju" aria-label="Ukloni afilijaciju {{ affiliation.institution_name }}">
        <i class="bi bi-x-lg" aria-hidden="true"></i>
    </button>
</div>
