{# User menu in the top bar. Rendered once by admin_base.html. #}
<div class="dropdown topbar-user">
  <button class="topbar-user__toggle dropdown-toggle"
          type="button"
          id="userDropdown"
          data-bs-toggle="dropdown"
          aria-expanded="false"
          aria-label="Korisnički meni">
    <i class="bi bi-person-circle" aria-hidden="true"></i>
    <span class="topbar-user__name">{% if user.name %}{{ user.name }}{% else %}{{ user.email }}{% endif %}</span>
  </button>
  <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
    <li>
      <a class="dropdown-item" href="{% url 'users:detail' user.pk %}">
        <i class="bi bi-person me-2" aria-hidden="true"></i>Moj profil
      </a>
    </li>
    <li><hr class="dropdown-divider" /></li>
    <li>
      <form method="post" action="{% url 'account_logout' %}">
        {% csrf_token %}
        <button type="submit" class="dropdown-item topbar-user__logout">
          <i class="bi bi-box-arrow-right me-2" aria-hidden="true"></i>Odjava
        </button>
      </form>
    </li>
  </ul>
</div>
